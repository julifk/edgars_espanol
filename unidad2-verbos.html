<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unidad 2: Los verbos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1b2d;--y:#ffd23f;--r:#d7263d;--b:#2a7fff;--g:#1b8a4b;--mut:#6b6580;--line:#e6e0f0}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--y);color:var(--ink);font:18px/1.5 Nunito,system-ui,sans-serif;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
h1,.q,.btn,nav button,.em{font-family:Fredoka,system-ui,sans-serif;font-weight:700}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--ink);font-weight:700}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:18px;text-align:center;margin:10px 0 12px}
.hero h1{margin:0;font-size:clamp(30px,8vw,48px);color:var(--y);line-height:1.1}.hero p{margin:4px 0 0}
.snd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;margin-bottom:12px;font-size:15px}
.snd select{width:auto;max-width:200px;padding:4px 8px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
nav button,.btn,.tb{font-size:17px;border:3px solid var(--ink);border-radius:26px;padding:7px 14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tb{font:700 15px Fredoka,sans-serif;padding:5px 12px}
nav button.on{background:var(--r);color:#fff}
.btn{background:var(--r);color:#fff;font-size:19px;padding:10px 22px;margin-top:10px}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--r);outline-offset:2px}
section{display:none;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px}
section.on{display:block}
.in{color:var(--mut);margin:0 0 10px}
.hud{display:flex;justify-content:space-between;font:700 19px Fredoka,sans-serif}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
.em{font-size:56px;line-height:1.15;text-align:center}.q{font-size:25px;margin:6px 0;text-align:center}
.lv{font:400 15px Nunito,sans-serif;color:var(--mut)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts button{font:700 19px Fredoka,sans-serif;padding:12px 6px;border-radius:14px;border:3px solid var(--ink);background:var(--b);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.opts button.ok{background:var(--g)}.opts button.no{background:var(--r)}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
.note{min-height:3em;margin-top:8px;text-align:center}
.tip{background:#fff4c2;border-radius:12px;padding:8px 12px;font-size:16px;margin:10px 0}
.sr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:2px solid var(--line)}.sr:first-of-type{border:0}
.sd{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--y);font-size:19px;cursor:pointer}
.e{color:var(--r);font-weight:700}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:430px;margin:8px 0}
th,td{padding:6px 8px;border-top:2px solid var(--line);text-align:left}
td button{font:700 17px Fredoka,sans-serif;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;text-align:left}
input,select,textarea{font:inherit;color:var(--ink);background:#faf8ff;border:3px solid var(--line);border-radius:10px;padding:6px 10px;width:100%}
textarea{height:170px;font-size:14px}
.cr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
 <p><a href="index.html">← Inicio</a></p>
 <div class="hero"><h1>⚙️ Unidad 2: Los verbos</h1><p>Глаголы в настоящем времени · -ar, -er, -ir · ser, estar, tener, ir, querer, hacer</p></div>
 <div class="snd">
  <button class="tb" id="sb">🔊 Звук: вкл</button>
  <label>Голос <select id="vs" aria-label="Голос"></select></label>
  <label>Скорость <select id="sp" aria-label="Скорость"><option value=".7">медленно</option><option value=".85" selected>обычно</option><option value="1">быстро</option></select></label>
  <button class="tb" id="tv">▶ Проверить</button>
 </div>
 <nav id="nav"></nav><div id="secs"></div>
</div>
<script>
const $=s=>document.querySelector(s),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),pick=a=>a[Math.random()*a.length|0];
const nz=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[.,?!¡¿]/g,"").replace(/\s+/g," ").trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let NAME="Edgar",SND=true,LOG=[],T0=Date.now();
const st=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
/* ---- sonido: on/off, voz, velocidad ---- */
let VO=[],AU;
const ld=()=>{try{VO=speechSynthesis.getVoices().filter(v=>v.lang.replace("_","-").toLowerCase().indexOf("es")==0)}catch(e){}
 const cur=st("voz")||"";$("#vs").innerHTML=VO.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("")+'<option value="online">Онлайн-голос</option>';
 if([...$("#vs").options].some(o=>o.value===cur))$("#vs").value=cur};
try{speechSynthesis.addEventListener("voiceschanged",ld)}catch(e){}
const say=t=>{if(!SND)return;t=t.replace(/\*/g,"");const n=$("#vs").value,v=VO.find(x=>x.name===n),r=+$("#sp").value;
 const on=()=>{try{AU&&AU.pause();AU=new Audio("https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=es&q="+encodeURIComponent(t));AU.playbackRate=r;const p=AU.play();p&&p.catch&&p.catch(()=>{})}catch(e){}};
 if(!v)return on();try{const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=r;u.onerror=on;speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){on()}};
if(st("snd")==="0")SND=false;
const sbU=()=>{$("#sb").textContent=SND?"🔊 Звук: вкл":"🔇 Звук: выкл"};sbU();
$("#sb").onclick=()=>{SND=!SND;st("snd",SND?"1":"0");sbU();if(!SND){try{speechSynthesis.cancel();AU&&AU.pause()}catch(e){}}};
$("#vs").onchange=()=>{st("voz",$("#vs").value);say("Hola, me llamo Edgar")};$("#tv").onclick=()=>say("Hola, me llamo Edgar. Vivo en Alicante.");
ld();setTimeout(ld,600);
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)say(b.dataset.say)});
/* ---- navegación ---- */
const SEC=[["s1","🎬 Diálogo"],["s2","📋 Tablas"],["s3","✅ Elige"],["s4","✍️ Escribe"],["s5","🧩 Ordena"],["s6","☕ En el bar"],["s7","🗣️ Habla"],["s8","📨 Enviar"]];
$("#nav").innerHTML=SEC.map((x,i)=>`<button data-t="${x[0]}" class="${i?"":"on"}">${x[1]}</button>`).join("");
$("#secs").innerHTML=SEC.map((x,i)=>`<section id="${x[0]}" class="${i?"":"on"}"></section>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t))};
/* ---- verbos ---- */
const P=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ustedes"],E={ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]};
const V={};
[["hablar","говорить"],["trabajar","работать"],["estudiar","учить, изучать"],["bailar","танцевать"],["comer","есть, кушать"],["beber","пить"],["leer","читать"],["vivir","жить"],["escribir","писать"],["abrir","открывать"]].forEach(([i,r])=>{const t=i.slice(-2),s=i.slice(0,-2);V[i]={ru:r,t,f:E[t].map(e=>s+e)}});
const IR={ser:["soy","eres","es","somos","sois","son"],estar:["estoy","estás","está","estamos","estáis","están"],tener:["tengo","tienes","tiene","tenemos","tenéis","tienen"],ir:["voy","vas","va","vamos","vais","van"],querer:["quiero","quieres","quiere","queremos","queréis","quieren"],hacer:["hago","haces","hace","hacemos","hacéis","hacen"]};
const IRU={ser:"быть (кто? какой?)",estar:"быть (где? как себя чувствуешь?)",tener:"иметь",ir:"идти, ехать",querer:"хотеть",hacer:"делать"};
Object.keys(IR).forEach(i=>V[i]={ru:IRU[i],t:"x",f:IR[i]});
const why=(v,k)=>{const d=V[v],a=d.f[k];return d.t==="x"?`«${v}» — неправильный глагол, его формы надо выучить. С «${P[k]}»: <b>${a}</b>.`:`С «${P[k]}» у глаголов на -${d.t} окончание <b>-${E[d.t][k]}</b>: ${v} → <b>${a}</b>.`};
/* ---- 1 diálogo ---- */
const D=[["🧑‍🍳 Camarero","Buenos días. ¿Qué *quieres* tomar?","Доброе утро. Что будешь пить?"],["🧑 Edgar","Buenos días. *Quiero* un café con leche, por favor.","Доброе утро. Я хочу кофе с молоком, пожалуйста."],["🧑‍🍳 Camarero","¿Algo más? ¿*Comes* algo?","Что-нибудь ещё? Ты что-нибудь ешь?"],["🧑 Edgar","Sí, *como* una tostada con tomate.","Да, я ем тост с помидором."],["🧑‍🍳 Camarero","¿*Vives* aquí, en Alicante?","Ты живёшь здесь, в Аликанте?"],["🧑 Edgar","No, no *vivo* aquí. *Estoy* de vacaciones y *estudio* español.","Нет, я здесь не живу. Я в отпуске и учу испанский."],["🧑‍🍳 Camarero","¡Qué bien! *Hablas* muy bien. ¿*Vas* a la playa hoy?","Здорово! Ты очень хорошо говоришь. Ты сегодня идёшь на пляж?"],["🧑 Edgar","Sí, *voy* a la playa. Gracias. ¿Cuánto *es*?","Да, иду. Спасибо. Сколько с меня?"],["🧑‍🍳 Camarero","*Son* tres euros.","Три евро."]];
$("#s1").innerHTML=`<p class="in">☕ Бар в Аликанте. Слушай, читай, потом повтори вслух. Красным выделены глаголы.</p>`+D.map(d=>`<div class="sr"><button class="sd" data-say="${esc(d[1])}" aria-label="Escuchar">🔊</button><div><b>${d[0]}</b><br>${d[1].replace(/\*(.+?)\*/g,'<span class="e">$1</span>')}<br><span class="lv ru" hidden>${d[2]}</span></div></div>`).join("")+`<button class="tb" id="rt" style="margin-top:12px">🇷🇺 Показать / скрыть перевод</button><div class="tip">💡 В испанском «я», «ты» часто не говорят: <b>Hablo español</b> = Я говорю по-испански. Окончание уже показывает, кто действует.</div>`;
$("#rt").onclick=()=>document.querySelectorAll(".ru").forEach(x=>x.hidden=!x.hidden);
/* ---- 2 tablas ---- */
const cell=(f,e)=>`<td><button data-say="${f}">${e?f.slice(0,f.length-e.length)+'<span class="e">'+e+"</span>":f} 🔊</button></td>`;
$("#s2").innerHTML=`<p class="in">Нажми на форму — услышишь её. Красным выделено окончание.</p><div class="q" style="text-align:left">1. Правильные глаголы</div><div class="sc"><table><tr><th></th><th>-AR hablar<br><span class="lv">говорить</span></th><th>-ER comer<br><span class="lv">есть</span></th><th>-IR vivir<br><span class="lv">жить</span></th></tr>${P.map((p,k)=>`<tr><td>${p}</td>${["hablar","comer","vivir"].map(v=>cell(V[v].f[k],E[V[v].t][k])).join("")}</tr>`).join("")}</table></div><div class="tip">💡 Окончания -ER и -IR почти одинаковые. Различие только в <b>nosotros</b> (-emos / -imos) и <b>vosotros</b> (-éis / -ís).</div><div class="q" style="text-align:left">2. Неправильные глаголы — учим наизусть</div><div class="sc"><table><tr><th></th>${Object.keys(IR).map(v=>`<th>${v}<br><span class="lv">${IRU[v]}</span></th>`).join("")}</tr>${P.map((p,k)=>`<tr><td>${p}</td>${Object.keys(IR).map(v=>cell(IR[v][k])).join("")}</tr>`).join("")}</table></div><div class="tip">💡 <b>ser</b> — кто ты, откуда, какой (Soy de Rusia). <b>estar</b> — где ты, как ты (Estoy en Alicante, Estoy bien).</div><div class="q" style="text-align:left">3. Ещё глаголы -ar / -er / -ir</div>${["trabajar","estudiar","bailar","beber","leer","escribir","abrir"].map(v=>`<div class="sr"><button class="sd" data-say="${v}">🔊</button><div><b>${v}</b> — ${V[v].ru}</div></div>`).join("")}`;
/* ---- ejercicios ---- */
const S=[["🥘","Yo ___ paella en Valencia.","comer",0],["🏖️","Tú ___ en Alicante.","vivir",1],["🇪🇸","Nosotros ___ español.","estudiar",3],["🍺","Ellos ___ cerveza en la terraza.","beber",5],["💃","María ___ flamenco.","bailar",2],["📰","Vosotros ___ el periódico.","leer",4],["🚆","Yo ___ a Sevilla en tren.","ir",0],["🏨","Mi hermano ___ en un hotel.","trabajar",2],["📍","Nosotros ___ en Madrid.","estar",3],["🥐","Tú ___ hambre.","tener",1],["☕","Yo ___ un café con leche.","querer",0],["🇷🇺","Ellos ___ de Sevilla.","ser",5],["✉️","Usted ___ un correo.","escribir",2],["🏪","Yo ___ la tienda a las nueve.","abrir",0],["🗣️","Tú ___ muy bien español.","hablar",1]];
function ex(id,typed,intro){const el=$("#"+id);let qs,i,s;
 const start=()=>{qs=shuf(S).slice(0,8).map(([e,t,v,k])=>({e,q:t.replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")+`<br><span class="lv">(${v} · ${V[v].ru})</span>`,a:V[v].f[k],o:shuf([V[v].f[k],...shuf(V[v].f.filter(x=>x!==V[v].f[k])).slice(0,3)]),w:why(v,k),s:t.replace("___",V[v].f[k])}));i=0;s=0;draw()};
 const draw=()=>{if(i>=qs.length){LOG.push({sec:id,score:s+"/"+qs.length});el.innerHTML=`<div class="em">${s>6?"🏆":"🎉"}</div><div class="q">${s} / ${qs.length}</div><p style="text-align:center">¡Muy bien, ${esc(NAME)}! 🌟</p><div style="text-align:center"><button class="btn" id="${id}r">Otra vez</button></div>`;$("#"+id+"r").onclick=start;return}
  const q=qs[i];el.innerHTML=`<p class="in">${intro}</p><div class="hud"><span>⭐ ${s}</span><span>${i+1}/${qs.length}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="em">${q.e}</div><div class="q">${q.q}</div>${typed?`<div style="text-align:center"><input id="${id}i" autocomplete="off" autocapitalize="off" spellcheck="false" style="max-width:240px;text-align:center" aria-label="Respuesta"><br><button class="btn" id="${id}c">Проверить</button></div>`:`<div class="opts">${q.o.map(x=>`<button>${x}</button>`).join("")}</div>`}<div class="note"></div>`;
  const note=el.querySelector(".note");let done=false;
  const fin=(ans,ok)=>{done=true;if(ok)s++;LOG.push({sec:id,q:q.s,ans,ok,c:q.a});note.innerHTML=(ok?"✅ ¡Muy bien! ":"❌ Правильно: <b>"+q.a+"</b>. ")+(ok?"":q.w+" ")+`<br><button class="tb" id="${id}n">Дальше →</button>`;$("#"+id+"n").onclick=()=>{i++;draw()};say(q.s)};
  if(typed){const inp=$("#"+id+"i"),go=()=>{if(done)return;const v=inp.value.trim();if(!v)return;const ok=nz(v)===nz(q.a);fin(v,ok);if(ok&&v.toLowerCase()!==q.a)note.insertAdjacentHTML("afterbegin","С ударением: <b>"+q.a+"</b>. ")};$("#"+id+"c").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};inp.focus()}
  else el.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(done)return;const ok=b.textContent===q.a;b.classList.add(ok?"ok":"no");if(!ok)el.querySelectorAll(".opts button").forEach(x=>{if(x.textContent===q.a)x.classList.add("ok")});fin(b.textContent,ok)})};
 start()}
ex("s3",false,"Выбери правильную форму глагола.");ex("s4",true,"Напиши правильную форму. Акценты желательны, но не обязательны.");
/* ---- 5 ordena ---- */
const OS=["Yo vivo en Alicante","Nosotros comemos paella","Tú bebes café con leche","Ellos van a la playa","Ella trabaja en un hotel","Vosotros estudiáis español","Yo quiero un té","Mi hermano es de Madrid"];
(function(){const el=$("#s5");let qs,i,s,pl,words,tgt;const start=()=>{qs=shuf(OS).slice(0,6);i=0;s=0;next()};
 const next=()=>{if(i>=qs.length){LOG.push({sec:"s5",score:s+"/"+qs.length});el.innerHTML=`<div class="em">🏆</div><div class="q">${s} / ${qs.length}</div><p style="text-align:center">¡Muy bien, ${esc(NAME)}!</p><div style="text-align:center"><button class="btn" id="o_r">Otra vez</button></div>`;$("#o_r").onclick=start;return}tgt=qs[i];words=shuf(tgt.split(" ").map(w=>({w})));pl=[];draw()};
 const draw=()=>{const left=words.filter(x=>!pl.includes(x));
  el.innerHTML=`<p class="in">Собери предложение: нажимай на слова по порядку.</p><div class="hud"><span>⭐ ${s}</span><span>${i+1}/${qs.length}</span></div><div class="q" style="min-height:2.4em">${pl.map(x=>x.w).join(" ")||"…"}</div><div class="opts" style="grid-template-columns:repeat(auto-fit,minmax(90px,1fr))">${left.map(x=>`<button data-k="${words.indexOf(x)}">${x.w}</button>`).join("")}</div><div style="text-align:center"><button class="tb" id="o_u" style="margin-top:10px">↩ Назад</button></div>`;
  el.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{pl.push(words[+b.dataset.k]);if(pl.length<words.length)return draw();const mine=pl.map(x=>x.w).join(" "),ok=mine===tgt;if(ok)s++;LOG.push({sec:"s5",q:tgt,ans:mine,ok,c:tgt});say(tgt);
   el.innerHTML=`<div class="em">${ok?"✅":"❌"}</div><div class="q">${tgt}</div><p style="text-align:center">${ok?"¡Muy bien!":"Правильный порядок: подлежащее → глагол → остальное."} 🎤 Скажи вслух!</p><div style="text-align:center"><button class="btn" id="o_n">Дальше →</button></div>`;$("#o_n").onclick=()=>{i++;next()}});
  $("#o_u").onclick=()=>{pl.pop();draw()}};start()})();
/* ---- 6 diálogo guiado ---- */
const G=[["¿Qué quieres tomar?","Quiero un café, por favor.","Quieres un café, por favor.","Quiere un café, por favor.","Ты говоришь о себе → <b>yo</b> → quiero."],["¿Dónde vives?","Vivo en Alicante.","Vives en Alicante.","Vivir en Alicante.","О себе → <b>yo</b>: vivo. Инфинитив (vivir) в такой фразе не нужен."],["¿Qué haces en España?","Estudio español y como paella.","Estudias español y como paella.","Estudio español y comes paella.","Оба глагола о себе → <b>yo</b>: estudio, como."],["¿Adónde vas ahora?","Voy a la playa.","Vas a la playa.","Va a la playa.","О себе → <b>yo</b>. Глагол ir: voy."]];
(function(){const el=$("#s6");let i=0,done;const draw=()=>{if(i>=G.length){el.innerHTML=`<div class="em">🎉</div><div class="q">¡Muy bien, ${esc(NAME)}!</div><p style="text-align:center">🎤 Теперь повтори весь диалог вслух с Julia — уже без подсказок.</p><div style="text-align:center"><button class="btn" id="g_r">Otra vez</button></div>`;$("#g_r").onclick=()=>{i=0;draw()};return}
 const g=G[i];done=false;el.innerHTML=`<p class="in">Ты в баре в Аликанте. Ответь официанту: выбери правильную фразу.</p><div class="hud"><span>☕</span><span>${i+1}/${G.length}</span></div><div class="sr"><button class="sd" data-say="${esc(g[0])}">🔊</button><div><b>🧑‍🍳 Camarero</b><br>${g[0]}</div></div><div class="opts" style="grid-template-columns:1fr">${shuf([g[1],g[2],g[3]]).map(x=>`<button>${x}</button>`).join("")}</div><div class="note"></div>`;
 el.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(done)return;const ok=b.textContent===g[1];b.classList.add(ok?"ok":"no");LOG.push({sec:"s6",q:g[0],ans:b.textContent,ok,c:g[1]});const n=el.querySelector(".note");
